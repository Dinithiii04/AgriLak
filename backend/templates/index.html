<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fertilizer Recommendation System</title>
</head>
<body>
    <h1>Fertilizer Recommendation System</h1>
    <form id="fertilizer-form">
        <label for="pH">pH:</label>
        <input type="number" id="pH" name="pH" step="0.01" required><br><br>
        
        <label for="Rainfall">Rainfall (mm):</label>
        <input type="number" id="Rainfall" name="Rainfall" step="0.01" required><br><br>
        
        <label for="Temperature">Temperature (°C):</label>
        <input type="number" id="Temperature" name="Temperature" step="0.01" required><br><br>
        
        <label for="Nitrogen">Nitrogen:</label>
        <input type="number" id="Nitrogen" name="Nitrogen" step="0.01" required><br><br>
        
        <label for="Phosphorus">Phosphorus:</label>
        <input type="number" id="Phosphorus" name="Phosphorus" step="0.01" required><br><br>
        
        <label for="Potassium">Potassium:</label>
        <input type="number" id="Potassium" name="Potassium" step="0.01" required><br><br>
        
        <button type="submit">Get Recommendation</button>
    </form>
    
    <div id="result"></div>
    
    <script>
        document.getElementById('fertilizer-form').addEventListener('submit', async function(event) {
            event.preventDefault();
            
            const formData = new FormData(event.target);
            const data = Object.fromEntries(formData.entries());
            
            const response = await fetch('/fertilizer/predict', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            });
            
            const result = await response.json();
            document.getElementById('result').innerText = `Nitrogen: ${result.Nitrogen}, Phosphorus: ${result.Phosphorus}, Potassium: ${result.Potassium}`;
        });
    </script>
</body>
</html>
